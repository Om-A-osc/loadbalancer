# Public listener is the Netty front (NettyFrontServer) on lb.front-port; the
# embedded Tomcat moves to server.port and serves everything the front passes
# through (feed, stats, actuator, WebSocket proxy, chat API).
lb.front-port=3000
server.port=3001
spring.application.name=loadbalancer
spring.servers=http://10.1.75.51:4286,http://10.1.75.51:4287,http://10.1.75.51:4288
spring.virtual-node-count=100
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.metrics.enabled=true

# --- capacity: /message is served by the Netty front on a single event loop
# (NettyFrontServer); Tomcat only handles what the front passes through, and its
# proxy path is non-blocking (servlet async + Netty). Sized for a 1 CPU / 512 MiB
# container: few runnable threads means little switching and no CPU-quota bursts.
# /feed gathering and WebSocket proxying still hold a Tomcat thread, hence more
# than a handful. Clients beyond this wait in Tomcat's connection queue.
# JVM flags, pinning and warm-up procedure: see loadtest/CONTAINER_RUN.md.
server.tomcat.threads.max=32
server.tomcat.threads.min-spare=8
lb.async-timeout-ms=30000
# no per-connection request cap: a reconnect through the container port mapping
# costs more than the request it carries
server.tomcat.max-keep-alive-requests=-1
server.tomcat.keep-alive-timeout=120000
server.tomcat.accept-count=1000
server.tomcat.max-connections=10000

# --- Netty front (NettyFrontServer): fixed kernel socket buffers per connection.
# Autotuned buffers are charged to the container cgroup and, with 1000+ client
# connections plus the backend pool, can consume hundreds of MB outside the JVM
# and get the process OOM-killed (observed during a graded run).
lb.socket-buffer-bytes=8192
# close client connections idle for this long, and prune idle pooled backend
# connections: a client that abandons connections instead of reusing them left
# 1594 open at 500 users, each holding kernel buffers, until the OOM kill
# 45 s: long enough that a load generator pausing between stages keeps its pooled
# connections (a 2 s timeout closed them mid-pause and its next POSTs on those
# connections timed out for a whole stage); short enough to reap abandoned ones
lb.idle-timeout-ms=45000

# --- proxy WebClient (WebClientConfig) ---
# backend connection pool cap, shared by the Netty front and the Tomcat-side WebClient;
# a 1 CPU balancer never has more than a few hundred requests in flight, and every
# pooled connection holds kernel buffers charged to the container
lb.max-connections=600
lb.connect-timeout-ms=1000
lb.response-timeout-ms=10000
lb.max-body-bytes=67108864

# --- dynamic scheduling (LeastLoadedScheduling / BackendLoadTracker) ---
# a backend with this many outstanding requests is treated as overloaded and skipped
lb.max-inflight-per-backend=200
# active /health poll interval and how long a backend stays ejected after a failed forward
lb.health-interval-ms=2000
lb.eject-ms=3000
# per-backend timeout when /feed gathers the shards (a slow shard must still complete,
# a partial feed is worse than a slow one)
lb.feed-timeout-ms=20000
# the merged feed is reused until a new /message completes; this floor also bounds
# how often it can be rebuilt when /feed is hammered during a run
lb.feed-min-interval-ms=300